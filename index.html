<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kari Wu</title>
  <meta name="description" content="Kari Wu — UX Designer and artist. Portfolio of UI design, product design, branding, and illustration." />
  <meta property="og:title"       content="Kari Wu — UX Designer & Artist" />
  <meta property="og:description" content="Kari Wu — UX Designer and artist. Portfolio of UI design, product design, branding, and illustration." />
  <meta property="og:type"        content="website" />
  <link rel="icon" href="images/logo/catlogo-3.svg" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nothing+You+Could+Do&family=Jeju+Hallasan&family=Jersey+25&family=Just+Me+Again+Down+Here&family=Kirang+Haerang&family=La+Belle+Aurore&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/nav.css" />
  <link rel="stylesheet" href="styles/animations.css" />

  <style>
    /* ─── HERO ───────────────────────────────────────────────────────────────── */

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
      padding-top: var(--space-16);
      min-height: 100vh;
    }

    @media (min-width: 701px) {
      .hero {
        justify-content: center;
        padding-top: 0;
      }
    }

    .hero-line1 {
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 4.2vw, 4.5rem);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      max-width: 44vw;
      opacity: 0;
      animation: fadeIn 0.7s ease 0.1s forwards;
    }

    .hero-kari {
      font-family: 'Nothing You Could Do', cursive;
      color: var(--color-accent);
      font-size: 1.15em;
      transition: font-family 0s;
      cursor: none;
    }

    .hero-line2 {
      font-family: var(--font-display);
      font-size: clamp(1.9rem, 4.2vw, 4.5rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.02em;
      color: var(--color-ink);
      max-width: 44vw;
      margin-top: 0;
      opacity: 0;
      animation: fadeIn 0.7s ease 0.3s forwards;
    }

    .hero-doodle {
      position: absolute;
      right: max(calc(var(--container-padding) - 3.5rem), calc((100vw - var(--container)) / 2 + var(--container-padding) - 3.5rem));
      top: var(--space-24);
      width: clamp(400px, 58vw, 860px);
      aspect-ratio: 1920 / 1080;
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 0.8s ease 0.5s forwards;
    }

    .hero-doodle > img:first-child {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hero-doodle-night > img:first-child {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* night doodle — hidden by default, shown when dark */
    .hero-doodle-night {
      position: absolute;
      right: max(calc(var(--container-padding) - 3.5rem), calc((100vw - var(--container)) / 2 + var(--container-padding) - 3.5rem));
      top: var(--space-24);
      width: clamp(400px, 58vw, 860px);
      aspect-ratio: 1920 / 1080;
      pointer-events: none;
      display: none;
    }

    .hero-doodle-night > img:first-child {
      width: 100%;
      height: 100%;
      display: block;
    }

    body.is-dark .hero-doodle       { display: none; }
    body.is-dark .hero-doodle-night { display: block; }

    /* lightbulb overlay — day */
    .hero-lightbulb {
      position: absolute;
      left: 79.88%;
      top: 17.94%;
      width: 7.23%;
      height: auto;
      pointer-events: all;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 0.25s ease;
    }

    .hero-lightbulb-hint {
      position: absolute;
      left: 66%;
      top: 21%;
      font-family: var(--font-mono);
      font-size: clamp(0.6rem, 1vw, 0.85rem);
      color: var(--color-accent);
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }

    .hero-lightbulb:hover {
      transform: scale(1.1);
    }

    /* lightbulb overlay — night */
    .hero-lightbulb-night {
      position: absolute;
      left: 80.57%;
      top: 17.60%;
      width: 7.53%;
      height: auto;
      pointer-events: all;
      cursor: pointer;
      transform-origin: center center;
      transition: transform 0.25s ease;
    }

    .hero-lightbulb-night:hover {
      transform: scale(1.1);
    }
    @media (max-width: 700px) {
      .hero-doodle { display: none; }
      .hero-line1, .hero-line2 { max-width: 100%; }
      .hero {
        padding-top: calc(var(--nav-height) + var(--space-8));
        padding-bottom: var(--space-16);
      }
    }

    @media (max-width: 480px) {
      .hero-line1, .hero-line2 {
        font-size: clamp(1.6rem, 8vw, 2.4rem);
      }
      .play-row { gap: var(--space-4); padding: var(--space-6) 0; }
      .sec-label { padding-top: var(--space-8); }
    }

    /* ─── DARK TOGGLE ────────────────────────────────────────────────────────── */

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .hero-scroll-hint {
      display: flex;
      align-items: center;
      gap: 0.4em;
      margin-top: var(--space-8);
      opacity: 0;
      animation: fadeIn 0.7s ease 0.8s forwards;
    }

    .hero-scroll-label {
      font-size: 0.6rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-muted);
    }

    .hero-scroll-arrow {
      font-size: 0.75rem;
      color: var(--color-muted);
      display: inline-block;
      animation: scrollBounce 2s ease-in-out 1.5s infinite;
    }

    @keyframes scrollBounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(4px); }
    }

    /* ─── SCRIBBLY DIVIDER ───────────────────────────────────────────────────── */

    .scribble-divider {
      padding-block: var(--space-2);
      margin-top: var(--space-16);
    }

    .scribble-line {
      width: 100%;
      height: 30px;
      display: block;
      overflow: visible;
    }

    .scribble-line path {
      animation: scribble-boil 0.45s steps(1) infinite;
    }

    @keyframes scribble-boil {
      0%, 100% { filter: url(#boil-a); }
      33%       { filter: url(#boil-b); }
      66%       { filter: url(#boil-c); }
    }

    /* ─── SECTION LABEL ──────────────────────────────────────────────────────── */

    .sec-label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: var(--space-8);
      padding-top: var(--space-16);
    }

    /* ─── PROJECT LIST ───────────────────────────────────────────────────────── */

    .proj-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      align-items: start;
      isolation: isolate;
    }

    .proj-card {
      background: #fff;
      border-radius: 14px;
      border: 1.5px solid var(--color-border);
      padding: 14px 14px 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      margin: 0 -28px;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: none;
    }

    body.is-dark .proj-card {
      background: #2e2c42;
      border-color: #504e68;
    }

    /* each card gets a slight random tilt */
    .proj-card:nth-child(1)  { transform: rotate(-2deg);   margin-top: 0;      z-index: 30; }
    .proj-card:nth-child(2)  { transform: rotate(1.5deg);  margin-top: 80px;   z-index: 30; }
    .proj-card:nth-child(3)  { transform: rotate(-1deg);   margin-top: -40px;  z-index: 30; }
    .proj-card:nth-child(4)  { transform: rotate(2deg);    margin-top: -80px;  z-index: 10; }
    .proj-card:nth-child(5)  { transform: rotate(-1.5deg); margin-top: 60px;   z-index: 10; }

    .proj-card:hover {
      transform: rotate(0deg) translateY(-8px) !important;
      box-shadow: 8px 10px 0px var(--color-accent);
      z-index: 10 !important;
    }

    body.is-dark .proj-card:hover {
      box-shadow: 6px 8px 0px #ffcb58;
    }

    .proj-card-img {
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      border-radius: 6px;
      background: var(--color-faint);
    }

    .proj-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .proj-card:hover .proj-card-img img {
      transform: scale(1.04);
    }

    .proj-card-body {
      padding: 0 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .proj-card-title {
      font-family: var(--font-display);
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      font-weight: 400;
      line-height: 1.2;
      color: var(--color-ink);
    }

    .proj-card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .proj-card-tag {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--color-border);
      border-radius: 99px;
      padding: 3px 9px;
      color: var(--color-muted);
    }

    body.is-dark .proj-card-tag { border-color: #504e68; }

    @media (pointer: coarse) { .proj-card { cursor: pointer; } }

    @media (max-width: 900px) {
      .proj-list { grid-template-columns: repeat(2, 1fr); }
      .proj-card { margin: 0; }
      .proj-card:nth-child(n) { transform: none; margin-top: 0; }
      .proj-card:hover { transform: translateY(-4px) !important; }
    }

    @media (max-width: 560px) {
      .proj-list { grid-template-columns: 1fr; }
    }

    /* ─── ART / PLAY LIST ────────────────────────────────────────────────────── */

    .play-section {
      padding-bottom: var(--space-32);
    }

    .play-row {
      display: flex;
      align-items: flex-start;
      gap: var(--space-8);
      padding: var(--space-12) 0;
      border-top: 1px solid var(--color-border);
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }

    .play-row:last-child { border-bottom: 1px solid var(--color-border); }

    .play-row-body {
      flex: 1;
      display: grid;
      grid-template-columns: 2rem 1fr;
      gap: var(--space-2) var(--space-4);
      align-items: center;
      min-width: 0;
    }

    .play-num {
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      color: var(--color-muted);
    }

    .play-title {
      font-family: var(--font-display);
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.1;
      transition: color 0.15s ease;
    }

    .play-row:hover .play-title { color: var(--color-accent); }

    .play-medium {
      grid-column: 2;
      font-size: 0.65rem;
      color: var(--color-muted);
      letter-spacing: 0.04em;
    }

    .play-thumb {
      flex-shrink: 0;
      width: 120px;
      height: 84px;
      overflow: hidden;
      background: var(--color-faint);
    }

    .play-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .play-row:hover .play-thumb img { transform: scale(1.06); }

    .play-arrow {
      font-size: 1rem;
      color: var(--color-muted);
      flex-shrink: 0;
      align-self: flex-start;
      transition: transform 0.2s ease, color 0.15s ease;
    }

    .play-row:hover .play-arrow {
      transform: translate(3px, -3px);
      color: var(--color-accent);
    }

    .play-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: var(--color-accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .play-row:hover .play-bar { transform: scaleX(1); }

    /* ─── VIEW ALL LINK ──────────────────────────────────────────────────────── */

    .view-all-link {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-top: var(--space-6);
      transition: color var(--trans-fast);
    }

    .view-all-link:hover { color: var(--color-ink); }

    .view-all-link span {
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .view-all-link:hover span { transform: translate(3px, -3px); }

    /* ─── RESPONSIVE ─────────────────────────────────────────────────────────── */

    @media (max-width: 700px) {
      .play-thumb { width: 84px; height: 60px; }
      .play-row-body { grid-template-columns: 1.5rem 1fr; }
    }

    @media (max-width: 480px) {
      .play-thumb { display: none; }
    }

    /* ── Line boil filter ──────────────────────────────────────────────────── */

    .hero-doodle-boil-filter {
      position: absolute;
      width: 0;
      height: 0;
    }

    @keyframes boil-seed-1 {
      0%,100% { filter: url(#boil-a); }
      33%      { filter: url(#boil-b); }
      66%      { filter: url(#boil-c); }
    }

    @keyframes boil-seed-2 {
      0%,100% { filter: url(#boil-b); }
      33%      { filter: url(#boil-c); }
      66%      { filter: url(#boil-a); }
    }

    .hero-doodle > img:first-child,
    .hero-lightbulb {
      animation: boil-seed-1 0.5s steps(1) infinite;
    }

    .hero-doodle-night > img:first-child,
    .hero-lightbulb-night {
      animation: boil-seed-2 0.5s steps(1) infinite;
    }
  </style>
</head>
<body>
  <script>
    (function(){
      if(sessionStorage.getItem('theme')==='dark'){
        document.body.classList.add('is-dark');
        document.body.style.backgroundColor = '#3c3a51';
        document.body.style.color = '#f0ede7';
        var r = document.documentElement;
        r.style.setProperty('--color-accent',  '#ffcb58');
        r.style.setProperty('--color-bg',       '#3c3a51');
        r.style.setProperty('--color-ink',      '#f0ede7');
        r.style.setProperty('--color-muted',    '#9a96b8');
        r.style.setProperty('--color-border',   '#504e68');
        r.style.setProperty('--color-faint',    '#464460');
      }
    })();
  </script>


  <!-- Line boil SVG filters -->
  <svg class="hero-doodle-boil-filter" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="boil-a" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="turbulence" baseFrequency="0.018 0.025" numOctaves="2" seed="1" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="boil-b" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="turbulence" baseFrequency="0.022 0.018" numOctaves="2" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="boil-c" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="turbulence" baseFrequency="0.015 0.022" numOctaves="2" seed="13" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <div id="nav-placeholder"></div>

  <main>

    <!-- ─── HERO ──────────────────────────────────────────────────────────────── -->
    <section class="hero">
      <div class="container">
        <p class="hero-line1">Hello! I'm <span class="hero-kari">Kari</span></p>
        <p class="hero-line2">– a designer and illustrator<br>making digital spaces feel a<br>little more personal</p>
        <div class="hero-scroll-hint" id="scroll-hint" style="cursor:pointer;">
          <span class="hero-scroll-label">scroll for more :)</span>
          <span class="hero-scroll-arrow">↓</span>
        </div>
        <div class="hero-doodle" aria-hidden="true">
          <img src="images/doodles/daydoodlev2.svg" alt="" />
          <img src="images/doodles/lightbulb.svg" class="hero-lightbulb" id="lightbulb-btn" alt="" />
          <span class="hero-lightbulb-hint">click me! <span style="font-size:1.4em;line-height:1">→</span></span>
        </div>
        <div class="hero-doodle-night" aria-hidden="true">
          <img src="images/doodles/nightdoodlev2.svg" alt="" />
          <img src="images/doodles/nightlightbulb.svg" class="hero-lightbulb-night" id="lightbulb-night-btn" alt="" />
        </div>
      </div>
    </section>

    <!-- ─── SELECTED WORK ─────────────────────────────────────────────────────── -->
    <section id="work">
      <div class="container">
        <p class="sec-label reveal">(selected work)</p>
        <div class="proj-list" id="proj-list"></div>
        <a href="art.html" class="view-all-link">check out some of my art <span>&#8599;</span></a>
      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>

  <!-- ─── Scripts ──────────────────────────────────────────────────────────────── -->
  <script src="js/projects.js"></script>
  <script src="js/art-data.js"></script>
  <script src="js/transitions.js"></script>
  <script src="js/main.js"></script>

  <script>
    /* ── Category label ─────────────────────────────────────────────────────── */
    function fmtCat(cat) {
      if (cat === 'ui-projects')       return 'UI Design';
      if (cat === 'product-design')    return 'Product Design';
      if (cat === 'branding-concepts') return 'Branding';
      return cat;
    }

    /* ── Render project list ────────────────────────────────────────────────── */
    function renderProjects() {
      var list = document.getElementById('proj-list');
      if (!list || !window.PROJECTS) return;

      var ids = ['previa', 'smart-pill-dispenser', 'build-our-bridges', '3miu', 'blink'];
      var selected = ids.map(function (id) {
        return window.PROJECTS.find(function (p) { return p.id === id; });
      }).filter(Boolean);

      selected.forEach(function (p, i) {
        var card = document.createElement('a');
        card.href      = p.id === 'previa' ? 'preva.html' : 'case-study.html?id=' + p.id;
        card.className = 'proj-card';
        card.setAttribute('data-cursor', 'hover');

        var tags = [fmtCat(p.category)];
        if (p.year) tags.unshift(p.year);

        card.innerHTML =
          '<div class="proj-card-img">' +
            '<img src="' + p.thumbnailImage + '" alt="' + p.title + '" loading="lazy" />' +
          '</div>' +
          '<div class="proj-card-body">' +
            '<span class="proj-card-title">' + p.title + '</span>' +
            '<div class="proj-card-tags">' +
              tags.map(function(t){ return '<span class="proj-card-tag">' + t + '</span>'; }).join('') +
            '</div>' +
          '</div>';

        list.appendChild(card);
      });
    }

    /* ── Render art/play list ───────────────────────────────────────────────── */
    function renderPlay() {
      var list = document.getElementById('play-list');
      if (!list || !window.ART_PIECES) return;

      window.ART_PIECES.slice(0, 2).forEach(function (a, i) {
        var row = document.createElement('a');
        row.href      = 'art.html';
        row.className = 'play-row';
        row.setAttribute('data-cursor', 'hover');

        row.innerHTML =
          '<div class="play-row-body">' +
            '<span class="play-num">0' + (i + 1) + '</span>' +
            '<span class="play-title">' + a.title + '</span>' +
            '<span class="play-medium">' + a.medium + ' &middot; ' + a.year + '</span>' +
          '</div>' +
          '<div class="play-thumb">' +
            '<img src="' + a.filename + '" alt="' + a.title + '" />' +
          '</div>' +
          '<span class="play-arrow">&#8599;</span>' +
          '<div class="play-bar"></div>';

        list.appendChild(row);
      });
    }

    /* ── Boot ───────────────────────────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', function () {
      renderProjects();
      renderPlay();

      document.getElementById('scroll-hint').addEventListener('click', function () {
        document.getElementById('work').scrollIntoView({ behavior: 'smooth' });
      });

      document.getElementById('lightbulb-btn').addEventListener('click', function () {
        document.body.classList.add('is-dark');
        document.documentElement.style.setProperty('--color-accent', '#ffcb58');
        sessionStorage.setItem('theme', 'dark');
      });
      /* ── Kari font cycling on hover ── */
      (function () {
        var fonts = [
          "'Jeju Hallasan', cursive",
          "'Jersey 25', cursive",
          "'Just Me Again Down Here', cursive",
          "'Kirang Haerang', cursive",
          "'La Belle Aurore', cursive"
        ];
        var el = document.querySelector('.hero-kari');
        var idx = 0;
        var interval = null;
        var fontsReady = false;

        /* Preload all fonts before enabling cycling */
        Promise.all(fonts.map(function (f) {
          var family = f.replace(/['"]/g, '').split(',')[0].trim();
          return document.fonts.load('1em "' + family + '"');
        })).then(function () { fontsReady = true; });

        el.addEventListener('mouseenter', function () {
          if (!fontsReady) return;
          el.style.display = 'inline-block';
          el.style.width = el.offsetWidth + 'px';
          idx = (idx + 1) % fonts.length;
          el.style.fontFamily = fonts[idx];
          interval = setInterval(function () {
            idx = (idx + 1) % fonts.length;
            el.style.fontFamily = fonts[idx];
          }, 700);
        });

        el.addEventListener('mouseleave', function () {
          clearInterval(interval);
          interval = null;
          el.style.fontFamily = "'Nothing You Could Do', cursive";
          el.style.display = '';
          el.style.width = '';
        });
      })();

      document.getElementById('lightbulb-night-btn').addEventListener('click', function () {
        var doodle = document.querySelector('.hero-doodle');
        doodle.style.animation = 'none';
        doodle.style.opacity = '1';
        document.body.classList.remove('is-dark');
        document.body.style.backgroundColor = '';
        document.body.style.color = '';
        var r = document.documentElement;
        r.style.setProperty('--color-accent', '#c8392b');
        r.style.removeProperty('--color-bg');
        r.style.removeProperty('--color-ink');
        r.style.removeProperty('--color-muted');
        r.style.removeProperty('--color-border');
        r.style.removeProperty('--color-faint');
        sessionStorage.setItem('theme', 'light');
      });
    });
  </script>
</body>
</html>
